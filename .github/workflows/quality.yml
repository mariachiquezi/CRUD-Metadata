name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET_KEY: ci-only-secret-key-at-least-32-bytes-long
      TEST_MONGODB_URI: mongodb://localhost:27017

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r requirements.txt

      - name: Verificar lint
        run: ruff check app tests

      - name: Verificar formatação
        run: ruff format --check app tests

      - name: Verificar tipos
        run: mypy app

      - name: Iniciar MongoDB
        run: docker compose up -d --wait mongo

      - name: Executar testes e medir cobertura
        run: >-
          python -m pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
          -q

      - name: Construir e testar a imagem da API
        run: |
          docker compose up -d --build --wait api
          curl --fail http://localhost:8000/health/ready

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: Exibir logs dos containers
        if: failure()
        run: docker compose logs

      - name: Limpar containers e volumes
        if: always()
        run: docker compose down -v
